name: Order Book Pressure Screener

on:
  schedule:
    # Кожні 10 хвилин. GitHub не гарантує точний час запуску (можлива
    # затримка на кілька хвилин при навантаженні на сервіс) — це нормально
    # для безкоштовного тарифу.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}  # дозволяє запустити вручну кнопкою "Run workflow"

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Підвантажуємо попередній стан (список активних стін), щоб не
      # надсилати алерт про ту саму стіну щоразу — тільки коли вона нова.
      - name: Restore state cache
        uses: actions/cache@v4
        with:
          path: state.json
          key: obp-state-${{ github.run_id }}
          restore-keys: |
            obp-state-

      - name: Run screener (single pass)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python orderbook_screener.py --once
